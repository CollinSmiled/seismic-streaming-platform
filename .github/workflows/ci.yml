name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  containers:
    name: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python scripts/rehearse_deployment.py

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.6.3'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check . ../scripts/database_backup.py ../scripts/deployment_support.py ../scripts/rehearse_deployment.py ../scripts/local_stack.py
      - run: uv run --frozen ruff format --check . ../scripts/database_backup.py ../scripts/deployment_support.py ../scripts/rehearse_deployment.py ../scripts/local_stack.py
      - run: uv run --frozen mypy src tests container_entrypoint.py ../scripts/database_backup.py ../scripts/deployment_support.py ../scripts/rehearse_deployment.py ../scripts/local_stack.py
      - run: uv run --frozen pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infrastructure:
    name: infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose config --quiet
      - run: docker compose up -d --wait kafka postgres
      - run: docker compose ps
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.6.3'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --python 3.12
        working-directory: backend
      - run: uv run --frozen pytest -q -m integration
        working-directory: backend
        env:
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          DATABASE_URL: postgresql://seismic:local-dev-only@127.0.0.1:5432/seismic
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: frontend
      - name: Prepare browser pipeline
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic earthquake.events.v1.browser-test --partitions 1 --replication-factor 1
          cd backend
          uv run --frozen alembic upgrade head
          uv run --frozen python -m seismic_stream.processor.worker --topic earthquake.events.v1.browser-test > /tmp/seismic-processor.log 2>&1 &
          echo $! > /tmp/seismic-processor.pid
          uv run --frozen uvicorn seismic_stream.api.app:app --host 0.0.0.0 --port 8000 > /tmp/seismic-api.log 2>&1 &
          echo $! > /tmp/seismic-api.pid
          uv run --frozen python -m seismic_stream.ingestion.fixture_producer --fixture tests/fixtures/emsc_catalogue_capture.json --ingested-at 2026-10-03T17:00:00Z --topic earthquake.events.v1.browser-test
        env:
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          DATABASE_URL: postgresql://seismic:local-dev-only@127.0.0.1:5432/seismic
      - run: npm run test:e2e
        working-directory: frontend
        env:
          KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
          E2E_KAFKA_TOPIC: earthquake.events.v1.browser-test
      - run: docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - run: docker compose run --rm --no-deps --entrypoint promtool prometheus check rules /etc/prometheus/alerts.yml
      - run: docker compose run --rm --no-deps --entrypoint promtool prometheus test rules /etc/prometheus/rules.test.yml
      - run: docker compose up -d --wait prometheus grafana
      - run: python scripts/verify_observability.py
      - if: always()
        run: |
          for name in seismic-api seismic-processor; do
            if test -f "/tmp/$name.pid"; then kill "$(cat "/tmp/$name.pid")" || true; fi
          done
          docker compose down -v
