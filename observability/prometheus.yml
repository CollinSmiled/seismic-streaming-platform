global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: seismic-api
    static_configs:
      - targets: [host.docker.internal:8000]
  - job_name: seismic-processor
    static_configs:
      - targets: [host.docker.internal:9101]
  - job_name: seismic-websocket
    static_configs:
      - targets: [host.docker.internal:9102]
  - job_name: seismic-reconciliation
    static_configs:
      - targets: [host.docker.internal:9103]
